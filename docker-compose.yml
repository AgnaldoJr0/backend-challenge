version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    container_name: backend_challenge_postgres
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: backend_challenge_db
    ports:
      - '5444:5432'
    volumes:
      - pgdata:/var/lib/postgresql/data

volumes:
  pgdata:
    driver: local